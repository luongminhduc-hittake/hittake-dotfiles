# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER , B, Browser, exec, $browser
bindd = SUPER SHIFT , B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, VSCode, exec, code
bindd = CTRL_SHIFT, ESCAPE, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker



# If your web app url contains #, type it as ## to prevent hyperland treat it "
# Overwrite existing bindings, like putting Omarchy Menu on Super + Space

unbind = SUPER, G

# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER, W 
bind = SUPER, Q , killactive,

# Custom AI Bindings
bindd = SUPER, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/"

# Binds the Super_L (Left Super key) alone to launch the application launcher (walker)

bindr = SUPER, SPACE, exec, killall walker || walker &

unbind = SUPER, F 
bind = , F11, fullscreen,

# Custom Screenshot Bind: Super + S executes the default screenshot utility
# Đối số 1 là "region" (chọn vùng), Đối số 2 là "clipboard"
bind = SUPER SHIFT, S, exec, omarchy-cmd-screenshot smart clipboard

unbind = SUPER, S


