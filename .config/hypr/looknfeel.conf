# --- BIẾN MÀU SẮC (Định nghĩa trước để dùng chung) ---
$activeBorderColor = rgb(cba6f7)
$inactiveBorderColor = rgb(313244)

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 1
    
    # Đã sửa lỗi chính tả "falseaster" thành "false"
    resize_on_border = false
    
    layout = dwindle
    
    # Đã xóa dòng trùng lặp, giữ lại true để hỗ trợ gaming
    allow_tearing = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    
    # Đã sửa: Opacity tối đa là 1.0 (100%). Giá trị 1.5 là không hợp lệ.
    active_opacity = 1.1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
    }
}

# https://wiki.hypr.land/Configuring/Variables/#group
group {
    # Đã có biến $activeBorderColor được định nghĩa ở đầu file nên dòng này sẽ không lỗi nữa
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = -1
    col.border_locked_inactive = -1

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes
    
    # Bật hiệu ứng trượt khi chuyển workspace
    animation = workspaces, 1, 10, default, slidefade 

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling.
    preserve_split = true # You probably want this
    force_split = 2 # Always split on the right
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
    mfact = 0.60
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
    # Sửa: anr_missed_pings không còn được hỗ trợ trong các bản Hyprland mới nhất, 
    # nếu báo lỗi thì comment dòng dưới lại.
    # anr_missed_pings = 3 
    new_window_takes_over_fullscreen = 1
    
    # Bật VRR (1 = luôn bật, 2 = chỉ khi fullscreen)
    vrr = 1
}

# https://wiki.hypr.land/Configuring/Variables/#cursor
cursor {
    hide_on_key_press = false
}

# Style Gum confirm to match terminal theme
env = GUM_CONFIRM_PROMPT_FOREGROUND,6       # Cyan
env = GUM_CONFIRM_SELECTED_FOREGROUND,0     # Black
env = GUM_CONFIRM_SELECTED_BACKGROUND,2     # Green
env = GUM_CONFIRM_UNSELECTED_FOREGROUND,0   # Black
env = GUM_CONFIRM_UNSELECTED_BACKGROUND,8   # Dark grey

plugin {
    hyprbars {
        # --- CẤU HÌNH MÀU SẮC (Catppuccin Mocha) ---
        bar_color = rgb(1e1e2e) 
        col.text = rgb(cdd6f4)

        # --- CẤU HÌNH KÍCH THƯỚC & FONT ---
        bar_height = 25
        bar_text_size = 11
        # Đã thêm dấu ngoặc kép cho tên font có khoảng trắng
        bar_text_font = "JetBrainsMono Nerd Font"
        bar_text_align = center
        bar_buttons_alignment = left
        
        # --- TÙY CHỈNH HIỂN THỊ ---
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 7
        bar_button_padding = 8
        icon_on_hover = true
        
        # --- CÁC NÚT BẤM (BUTTONS) ---
        # 1. Close (Red)
        hyprbars-button = rgb(f38ba8), 15, , hyprctl dispatch killactive
        # 2. Fullscreen (Yellow)
        hyprbars-button = rgb(f9e2af), 15, 󰊓, hyprctl dispatch fullscreen 1
        # 3. Float (Green)
        hyprbars-button = rgb(a6e3a1), 15, , hyprctl dispatch togglefloating

        # Double click title bar to fullscreen
        # Lưu ý: Cấu hình này có thể không hoạt động trên Hyprbars mới nhất nếu API thay đổi,
        # nhưng cứ giữ lại nếu bản của bạn hỗ trợ.
        # on_double_click = hyprctl dispatch fullscreen 1
    }
}

# Window Rules cho Hyprbars
windowrulev2 = plugin:hyprbars:nobar, class:^((?i)chromium)$
windowrulev2 = plugin:hyprbars:nobar, class:^((?i)code)$
windowrulev2 = plugin:hyprbars:nobar, class:^((?i)steam)$
windowrulev2 = plugin:hyprbars:nobar, class:^((?i)localsend)$